# ============================================================
# ASCII Art Player 配置文件
# 放在每个歌曲目录下，播放该歌曲时自动加载
# 修改后保存即可生效，配置项不存在时使用默认值
# ============================================================

# --- 窗口大小 ---
# 实际窗口大小 = 配置值 + 10（留余量给进度条和字幕）
# 例如 width=79 -> 实际宽度 89 列，height=24 -> 实际高度 34 行
width=200
height=117

# --- 调试模式 ---
# 1=显示帧格式检测信息、播放完成后显示跳帧统计
# 0=静默模式（默认）
debug=0

# --- 播放帧率 ---
# 每秒播放的帧数，范围 1~120，默认 25
fps=25

# --- 音乐播放方式 ---
# 0=用 MCI 播放音频文件 (mp3/wav/mid/ogg/flac/aac/m4a 等)
# 1=用 BGM 类播放乐谱 (music.txt 简谱文件)
use_bgm=0

# --- 总帧数 ---
# 帧编号从 0 开始，最后一帧编号 = total_frames
# resource 目录下应有 frame(0).txt 到 frame(total_frames).txt
total_frames=2800

# --- 播放时字号 ---
# 播放界面的 Consolas 字体大小，选歌界面固定为 16
# 范围 6~72，默认 8
font_size=6

# --- 字幕时间偏移 ---
# 单位：秒，支持小数如 0.5
# 正数=字幕延迟出现（晚 x 秒显示），负数=字幕提前出现（早 x 秒显示）
# 例如 subtitle_offset=1.5 表示所有字幕晚 1.5 秒显示
#      subtitle_offset=-0.5 表示所有字幕早 0.5 秒显示
subtitle_offset=0




